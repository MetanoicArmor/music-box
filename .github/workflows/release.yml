name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag. Empty uses VERSION.
        required: false
        default: ""
        type: string
      replace_existing:
        description: Replace assets already attached to the release
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  windows:
    name: Windows
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.20.0"
          cache: npm
      - run: npm ci
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          cache: true
      - run: powershell -ExecutionPolicy Bypass -File scripts/build-release.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: MusicBox-win64
          path: release/MusicBox-win64.zip
          if-no-files-found: error

  macos:
    name: macOS
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.20.0"
          cache: npm
      - run: npm ci
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          cache: true
      - name: Install CMake
        run: brew install cmake
      - run: bash scripts/build-release.sh
      - name: Require macOS archive
        run: test -s release/MusicBox-macos-arm64.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: MusicBox-macos
          path: release/MusicBox-macos-*.tar.gz
          if-no-files-found: error

  linux:
    name: Linux
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.20.0"
          cache: npm
      - run: npm ci
      - name: Install archive tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends curl unzip xz-utils python3 python3-venv make g++ cmake ninja-build patchelf squashfs-tools libgl1 libegl1 libfontconfig1 libdbus-1-3 libxkbcommon0 libxkbcommon-x11-0 libwayland-client0 libwayland-cursor0 libwayland-egl1 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render0 libxcb-render-util0 libxcb-shape0 libxcb-shm0 libxcb-sync1 libxcb-xfixes0 libxcb-xkb1 libxcb-xinerama0 libxcb-xinput0 libsm6 libice6 libgl1-mesa-dev libxkbcommon-dev
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          cache: true
      - name: Build portable archive and AppImage
        env:
          MUSICBOX_SKIP_SYSTEM_MPV: "1"
        run: bash scripts/build-release.sh
      - name: Require Linux archive and AppImage
        run: |
          test -s release/MusicBox-linux-x64.tar.gz
          test -s release/MusicBox-linux-x64.AppImage
      - uses: actions/upload-artifact@v4
        with:
          name: MusicBox-linux
          path: |
            release/MusicBox-linux-*.tar.gz
            release/MusicBox-linux-*.AppImage
          if-no-files-found: error

  android:
    name: Android
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.20.0"
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK
        run: |
          set -euo pipefail
          sdk="${HOME}/android-sdk"
          mkdir -p "$sdk/cmdline-tools"
          curl -fsSL -o /tmp/commandlinetools.zip https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip
          rm -rf /tmp/cmdline-tools
          unzip -q /tmp/commandlinetools.zip -d /tmp
          rm -rf "$sdk/cmdline-tools/latest"
          mv /tmp/cmdline-tools "$sdk/cmdline-tools/latest"
          echo "ANDROID_HOME=$sdk" >> "$GITHUB_ENV"
          echo "$sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$sdk/platform-tools" >> "$GITHUB_PATH"
          yes | "$sdk/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$sdk" --licenses >/dev/null || true
          "$sdk/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$sdk" --install "platforms;android-35" "build-tools;35.0.0"
      - run: npm ci
      - run: npm run build:client
      - run: bash scripts/build-android.sh
      - uses: actions/upload-artifact@v4
        with:
          name: MusicBox-android
          path: release/MusicBox-android.apk
          if-no-files-found: error

  publish:
    name: Publish
    needs: [windows, macos, linux, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist-artifacts
          merge-multiple: true
      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
          REPLACE: ${{ github.event_name == 'push' || github.event.inputs.replace_existing == 'true' }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          file_ver="$(tr -d '[:space:]' < VERSION)"
          if [[ "$EVENT_NAME" == "workflow_dispatch" && -n "$INPUT_TAG" ]]; then
            TAG="$INPUT_TAG"
          elif [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            TAG="v$file_ver"
          else
            TAG="$REF_NAME"
          fi
          if [[ "$TAG" != "v$file_ver" ]]; then
            echo "Release tag $TAG does not match VERSION ($file_ver)."
            exit 1
          fi
          files=(dist-artifacts/*)
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "No release files were downloaded."
            exit 1
          fi
          missing=0
          for name in \
            MusicBox-win64.zip \
            MusicBox-macos-arm64.tar.gz \
            MusicBox-linux-x64.tar.gz \
            MusicBox-linux-x64.AppImage \
            MusicBox-android.apk
          do
            if [[ ! -s "dist-artifacts/$name" ]]; then
              echo "Missing artifact: $name"
              missing=1
            fi
          done
          if [[ "$missing" != "0" ]]; then
            echo "Release files present:"
            ls -lh dist-artifacts
            exit 1
          fi
          ls -lh dist-artifacts
          version="$file_ver"
          if gh release view "$TAG" >/dev/null 2>&1; then
            if [[ "$REPLACE" == "true" ]]; then
              gh release upload "$TAG" "${files[@]}" --clobber
            else
              existing="$(gh release view "$TAG" --json assets --jq '.assets[].name')"
              for file in "${files[@]}"; do
                name="$(basename "$file")"
                if grep -qx "$name" <<< "$existing"; then
                  echo "Keeping existing asset: $name"
                else
                  gh release upload "$TAG" "$file"
                fi
              done
            fi
            gh release edit "$TAG" --notes-file scripts/release-notes.md
          else
            gh release create "$TAG" "${files[@]}" \
              --title "Music Box $version" \
              --notes-file scripts/release-notes.md
          fi
          gh release view "$TAG" --json url,assets --jq '{url:.url, assets:[.assets[].name]}'
